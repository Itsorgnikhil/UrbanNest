services:
  - type: web
    name: urbannest-lifestyle-store
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000, public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
